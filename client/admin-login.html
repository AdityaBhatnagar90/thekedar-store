<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - The Thekedar Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>The Thekedar Store</h1>

        <h2>Admin Login</h2>

        <form id="adminLoginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Admin Email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Admin Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <script src="js/admin-login.js"></script>

</body>

</html>
