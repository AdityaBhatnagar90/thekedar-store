<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | The Thekedar Store
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>
            The Thekedar Store
        </h1>

        <p>
            Login or create your account
            to book an inspection.
        </p>


        <form id="authForm">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >


            <label>
                Phone
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Enter Phone Number"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >


            <div class="button-group">

                <button
                    type="button"
                    id="signupButton"
                >
                    Sign Up
                </button>


                <button
                    type="button"
                    id="loginButton"
                >
                    Login
                </button>

            </div>

        </form>


        <br>


        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
