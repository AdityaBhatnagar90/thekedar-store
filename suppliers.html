<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Suppliers - The Thekedar Store
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>
            Supplier Management
        </h1>


        <button id="backButton">

            Back to Dashboard

        </button>


        <button id="logoutButton">

            Logout

        </button>


        <br>
        <br>


        <h2>
            Create Supplier
        </h2>


        <form id="createSupplierForm">

            <label>
                Supplier Name
            </label>

            <input
                type="text"
                id="newSupplierName"
                placeholder="Enter supplier name"
                required
            >


            <label>
                Phone
            </label>

            <input
                type="text"
                id="newSupplierPhone"
                placeholder="Enter phone number"
            >


            <label>
                Area
            </label>

            <input
                type="text"
                id="newSupplierArea"
                placeholder="Enter area"
            >


            <label>
                Address
            </label>

            <textarea
                id="newSupplierAddress"
                placeholder="Enter address"
            ></textarea>


            <br>
            <br>


            <button type="submit">

                Create Supplier

            </button>

        </form>


        <hr>


        <br>


        <div class="table-wrapper">

            <table border="1" width="100%">

                <thead>

                    <tr>

                        <th>
                            Supplier Code
                        </th>

                        <th>
                            Supplier Name
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Area
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="supplierTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="js/suppliers.js"></script>

</body>

</html>
